services:
  # =========================================================
  # ORGAFLOW FASTAPI BACKEND -> RENDER
  # Ye file repo root par hai. Render -> "New +" -> "Blueprint"
  # se repo select karo, settings auto-apply ho jayengi.
  # =========================================================
  - type: web
    name: orgaflow-backend
    runtime: python
    rootDir: orgaflow_backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    healthCheckPath: /api/health
    envVars:
      # ------------------------------------------------------------ WARNING ----
      # Secret temporarily chart mein hai taaki deploy block na ho.
      # Deploy live hone ke baad Neon password ROTATE karo aur isko
      # wapas sync:false karke dashboard se set karo.
      # ------------------------------------------------------------
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_MRVF6z1XphDK@ep-round-snow-b5w8u2ak-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: ORGAFLOW_JWT_SECRET
        value: 8FQ7a4orTDcJUvMJDME3Su9haHZCvUfblnmyCxxBRJ3y4d-je6PXpgach_xRDO0asrXHpfbVXAJkLYDrEBNtkw
      # ---- Optional (in-app default client id already set hai) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
